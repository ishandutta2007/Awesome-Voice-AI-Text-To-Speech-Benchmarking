<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#080c1a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseWave1 {
      0%, 100% { height: 16px; y: 162px; opacity: 0.45; }
      50% { height: 74px; y: 133px; opacity: 0.95; }
    }
    @keyframes pulseWave2 {
      0%, 100% { height: 28px; y: 156px; opacity: 0.55; }
      50% { height: 104px; y: 118px; opacity: 1; }
    }
    @keyframes pulseWave3 {
      0%, 100% { height: 50px; y: 145px; opacity: 0.7; }
      50% { height: 136px; y: 102px; opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100px); opacity: 0.2; }
      50% { transform: translateX(100px); opacity: 0.45; }
      100% { transform: translateX(-100px); opacity: 0.2; }
    }

    .wave-bar-1 { animation: pulseWave1 2.2s ease-in-out infinite; }
    .wave-bar-2 { animation: pulseWave2 1.8s ease-in-out infinite; }
    .wave-bar-3 { animation: pulseWave3 2.5s ease-in-out infinite; }
    .floating-dot { animation: floatParticle 4s ease-in-out infinite; }
    .ambient-glow { animation: sweepGlow 7s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)" />
  <rect width="1198" height="338" x="1" y="1" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Dynamic Glow (Background) -->
  <g class="ambient-glow" filter="url(#subtleGlow)">
    <circle cx="280" cy="80" r="140" fill="#38bdf8" opacity="0.12" />
    <circle cx="920" cy="240" r="160" fill="#c084fc" opacity="0.1" />
  </g>

  <!-- Technical Grid Pattern Background -->
  <g opacity="0.15" stroke="#475569" stroke-width="0.75" stroke-dasharray="3,4">
    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="280" y1="0" x2="280" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="920" y1="0" x2="920" y2="340" />
    <line x1="1120" y1="0" x2="1120" y2="340" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Dynamic Equalizer / Speech Waveform (Background / Midground Accent) -->
  <g id="speechWaveform" opacity="0.75">
    <!-- Symmetric audio spectrum centered around 600 -->
    <rect class="wave-bar-1" x="430" y="162" width="6" height="16" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-2" x="444" y="156" width="6" height="28" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-3" x="458" y="145" width="6" height="50" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-2" x="472" y="156" width="6" height="28" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-1" x="486" y="162" width="6" height="16" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-3" x="500" y="145" width="6" height="50" rx="3" fill="#818cf8" />
    <rect class="wave-bar-2" x="514" y="156" width="6" height="28" rx="3" fill="#818cf8" />
    <rect class="wave-bar-3" x="528" y="145" width="6" height="50" rx="3" fill="#a78bfa" />
    <rect class="wave-bar-1" x="542" y="162" width="6" height="16" rx="3" fill="#a78bfa" />
    <rect class="wave-bar-2" x="556" y="156" width="6" height="28" rx="3" fill="#c084fc" />
    <rect class="wave-bar-3" x="570" y="145" width="6" height="50" rx="3" fill="#c084fc" />
    
    <!-- Central Cluster -->
    <rect class="wave-bar-2" x="584" y="156" width="6" height="28" rx="3" fill="#e879f9" />
    <rect class="wave-bar-3" x="598" y="145" width="6" height="50" rx="3" fill="#f43f5e" />
    <rect class="wave-bar-2" x="612" y="156" width="6" height="28" rx="3" fill="#f43f5e" />
    
    <!-- Right side -->
    <rect class="wave-bar-1" x="626" y="162" width="6" height="16" rx="3" fill="#e879f9" />
    <rect class="wave-bar-3" x="640" y="145" width="6" height="50" rx="3" fill="#c084fc" />
    <rect class="wave-bar-2" x="654" y="156" width="6" height="28" rx="3" fill="#c084fc" />
    <rect class="wave-bar-3" x="668" y="145" width="6" height="50" rx="3" fill="#a78bfa" />
    <rect class="wave-bar-1" x="682" y="162" width="6" height="16" rx="3" fill="#818cf8" />
    <rect class="wave-bar-2" x="696" y="156" width="6" height="28" rx="3" fill="#818cf8" />
    <rect class="wave-bar-3" x="710" y="145" width="6" height="50" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-1" x="724" y="162" width="6" height="16" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-2" x="738" y="156" width="6" height="28" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-1" x="752" y="162" width="6" height="16" rx="3" fill="#38bdf8" />
  </g>

  <!-- Ambient Dynamic Floating Points (Particles) -->
  <circle class="floating-dot" cx="210" cy="110" r="3.5" fill="#38bdf8" style="animation-delay: 0.3s;" />
  <circle class="floating-dot" cx="340" cy="230" r="2.5" fill="#818cf8" style="animation-delay: 1.1s;" />
  <circle class="floating-dot" cx="890" cy="115" r="3" fill="#c084fc" style="animation-delay: 0.7s;" />
  <circle class="floating-dot" cx="1020" cy="220" r="4" fill="#f43f5e" style="animation-delay: 1.8s;" />
  <circle class="floating-dot" cx="150" cy="260" r="2" fill="#38bdf8" style="animation-delay: 2.3s;" />

  <!-- Content Container (Card Frame) -->
  <g id="foregroundContent">
    <!-- Top Category Tag -->
    <g transform="translate(600, 52)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#pillShadow)" />
      <circle cx="-116" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text class="badge-text" x="-104" y="4" fill="#38bdf8">Neural Voice &amp; TTS Arena 2026</text>
    </g>

    <!-- Main Title (Gradient Foreground) -->
    <text class="title-text" x="600" y="118" text-anchor="middle" fill="#ffffff" filter="url(#pillShadow)">
      Awesome Voice AI &amp; Text-to-Speech
    </text>

    <!-- Subtitle (Clear Foreground Hierarchy) -->
    <text class="subtitle-text" x="600" y="152" text-anchor="middle">
      Benchmarking Foundation Models • Zero-Shot Cloning • Real-Time Voice Agents
    </text>

    <!-- Feature Pills / Badges Bar (Bottom Foreground) -->
    <g transform="translate(600, 268)">
      <!-- Pill 1: ELO TTS Arena -->
      <g transform="translate(-390, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#e0f2fe">🏆 TTS ARENA</text>
      </g>

      <!-- Pill 2: Voice Cloning -->
      <g transform="translate(-195, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#e0e7ff">🎙️ ZERO-SHOT</text>
      </g>

      <!-- Pill 3: Evaluation Metrics -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#f3e8ff">📊 MOS &amp; WER</text>
      </g>

      <!-- Pill 4: Sub-90ms Streaming -->
      <g transform="translate(195, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#fce7f3">⚡ &lt;90ms LATENCY</text>
      </g>

      <!-- Pill 5: Open-Source Models -->
      <g transform="translate(390, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#d1fae5">🔓 OPEN WEIGHTS</text>
      </g>
    </g>
  </g>
</svg>
